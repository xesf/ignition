name: Build

# Builds and packages every platform. ci.yml runs it on pushes and pull
# requests, release.yml on version tags. Each job uploads one artifact,
# named <platform>-build, holding ignition-<platform>-<version>.<ext>.

on:
  workflow_call:
    inputs:
      version:
        description: Version stamped into the binaries and file names (vX.Y.Z...)
        required: true
        type: string

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build universal binary
        run: make -j"$(sysctl -n hw.ncpu)" VERSION=${{ inputs.version }} MACOS_ARCH="-arch arm64 -arch x86_64"

      - name: Test
        # The tests that need no game data.
        run: |
          make test_lisa test_menu test_settings MACOS_ARCH="-arch arm64 -arch x86_64"
          ./test_lisa build && ./test_menu && ./test_settings

      - name: Package
        run: |
          mkdir -p dist/ignition
          cp ignition cd_extract dist/ignition/
          cat > dist/ignition/README.txt << 'EOF'
          Ignition for macOS (Apple silicon and Intel)

          The game needs the files of your own Ignition CD. Put the disc image
          (the .cue file and its .bin files) in this folder; at the first start
          the game copies the files out of it into disc/. Or start it with
          --data <folder with the CD's files>.

          The program is not signed. If macOS refuses to open it, run
            xattr -d com.apple.quarantine ignition cd_extract
          in this folder, then start ./ignition from the Terminal.
          EOF
          cd dist && zip -r ../ignition-macos-${{ inputs.version }}.zip ignition

      - uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: ignition-macos-${{ inputs.version }}.zip

  linux:
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libx11-dev libgl-dev libasound2-dev file

      - name: Build
        run: make linux VERSION=${{ inputs.version }}

      - name: Package AppImage
        run: sh platforms/linux/appimage.sh ${{ inputs.version }} ${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}-build
          path: build-linux/ignition-linux-${{ matrix.arch }}-${{ inputs.version }}.AppImage

  # Cross-compiled with MinGW-w64: one .exe that needs only Windows' own DLLs.
  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 zip

      - name: Build
        run: make windows VERSION=${{ inputs.version }}

      - name: Package
        run: |
          mkdir -p dist/ignition
          cp build-windows/ignition.exe build-windows/cd_extract.exe dist/ignition/
          x86_64-w64-mingw32-strip dist/ignition/*.exe
          cat > dist/ignition/README.txt << 'EOF'
          Ignition for Windows (64-bit)

          The game needs the files of your own Ignition CD. Put the disc image
          (the .cue file and its .bin files) in this folder; at the first start
          the game copies the files out of it into disc\. Or start it with
          --data <folder with the CD's files>.
          EOF
          sed -i 's/$/\r/' dist/ignition/README.txt
          cd dist && zip -r ../ignition-windows-x86_64-${{ inputs.version }}.zip ignition

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64-build
          path: ignition-windows-x86_64-${{ inputs.version }}.zip

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.53

      - name: Build
        run: make web VERSION=${{ inputs.version }}

      - name: Package
        run: |
          cp platforms/web/README.md build-web/dist/README.md
          cd build-web/dist && zip -r ../../ignition-web-${{ inputs.version }}.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: ignition-web-${{ inputs.version }}.zip

  # SDK command-line tools, no Gradle: the runner image has the SDK and
  # an NDK. A release key is used when the ANDROID_KEYSTORE_BASE64,
  # ANDROID_KEYSTORE_PASS and ANDROID_KEY_ALIAS secrets are set;
  # otherwise build.sh signs with a throwaway debug key.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build zip python3

      - name: Build
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            export ANDROID_KEYSTORE="$RUNNER_TEMP/release.keystore"
          fi
          ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" make android VERSION=${{ inputs.version }}
          cp build-android/ignition.apk ignition-android-${{ inputs.version }}.apk

      - name: Test APK architectures
        run: python3 -m unittest discover -s tests -p test_android_apk.py -v

      - uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: ignition-android-${{ inputs.version }}.apk

  # Unsigned: sideloading tools sign it with the user's own Apple ID.
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          make ios VERSION=${{ inputs.version }}
          cp build-ios/ignition.ipa ignition-ios-${{ inputs.version }}.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: ignition-ios-${{ inputs.version }}.ipa

  # Runs `make vita` in the VitaSDK image, as the Vita build defines it
  # (docs/vita.md). The Vita build has not run on hardware yet; a failure
  # here does not fail the run, and a release without the VPK still
  # publishes.
  vita:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          docker run --rm -v "$PWD:/src" -w /src -e VITASDK=/usr/local/vitasdk vitasdk/vitasdk:latest \
            sh -c 'make vita VERSION=${{ inputs.version }}'
          cp build-vita/ignition.vpk ignition-vita-${{ inputs.version }}.vpk

      - uses: actions/upload-artifact@v4
        with:
          name: vita-build
          path: ignition-vita-${{ inputs.version }}.vpk
